<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>[[name]]</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d14; color: #e7e9f2; }
      main { text-align: center; padding: 2rem; }

    </style>
  </head>
  <body>
    <main>
      <h1>[[name]]</h1>
      <p>Launched with Launchbay.</p>
    </main>
  </body>
</html>
