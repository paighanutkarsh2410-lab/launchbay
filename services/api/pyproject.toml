[project]
name = "launchbay-api"
version = "0.1.0"
description = "Launchbay API: launches services from templates to a running deployment"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy[asyncio]==2.0.36",
  "aiosqlite==0.20.0",
  "asyncpg==0.30.0",
  "pydantic-settings==2.7.1",
  "httpx==0.28.1",
  "pyjwt[crypto]==2.10.1",
  "pyyaml==6.0.2",
  "sse-starlette==2.2.1",
  "anthropic==2.4.0",
  "google-genai==3.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "asgi-lifespan==2.1.0",
  "ruff==0.8.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
