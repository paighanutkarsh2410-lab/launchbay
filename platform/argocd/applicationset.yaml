# One Argo CD Application per file in launchbay-gitops/services/.
# Launchbay launches a service by committing that file; deleting it removes the app.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: launchbay-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        # Check Git every 30s instead of the default 3 minutes, so launches deploy quickly.
        requeueAfterSeconds: 30
        repoURL: https://github.com/GITOPS_OWNER/launchbay-gitops.git
        revision: main
        files:
          - path: services/*.yaml
  template:
    metadata:
      name: "{{ .name }}"
      # Deleting the app (its manifest left GitOps) deletes its Kubernetes resources too.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        app.kubernetes.io/managed-by: launchbay
        launchbay.dev/owner: "{{ .owner }}"
    spec:
      project: default
      source:
        repoURL: https://github.com/GITOPS_OWNER/launchbay-gitops.git
        targetRevision: main
        path: charts/service
        helm:
          valuesObject:
            name: "{{ .name }}"
            owner: "{{ .owner }}"
            template: "{{ .template }}"
            image: "{{ .image }}"
            port: "{{ .port }}"
            host: "{{ .host }}"
            runAsUser: "{{ .runAsUser }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .name }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        # Kyverno's guardrails apply to namespaces carrying this label.
        managedNamespaceMetadata:
          labels:
            launchbay.dev/managed: "true"
        retry:
          limit: 5
          backoff: { duration: 10s, factor: 2, maxDuration: 3m }
