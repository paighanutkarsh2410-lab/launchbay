# Argo CD for Launchbay, applied on top of the verified upstream install.yaml
# (scripts/platform-up.sh downloads and checks it).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - install.yaml
  - ingress.yaml
patches:
  # Plain HTTP behind Traefik, at http://argocd.localtest.me.
  - target: { kind: ConfigMap, name: argocd-cmd-params-cm }
    patch: |-
      - op: add
        path: /data
        value:
          server.insecure: "true"
          applicationsetcontroller.policy: create-update
  # A read-only API account that Launchbay uses to watch deploys.
  - target: { kind: ConfigMap, name: argocd-cm }
    patch: |-
      - op: add
        path: /data
        value:
          accounts.launchbay: apiKey
          timeout.reconciliation: 30s
  - target: { kind: ConfigMap, name: argocd-rbac-cm }
    patch: |-
      - op: add
        path: /data
        value:
          policy.csv: |
            g, launchbay, role:readonly
