{{- $_ := required "name is required" .Values.name }}
{{- $_ := required "image is required" .Values.image }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  labels: {{- include "service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels: {{- include "service.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "service.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsUser }}
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: {{ .Values.image }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: PORT
              value: {{ .Values.port | quote }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.awsEmulator }}
            # The local AWS emulator accepts any credentials. On real AWS the pod would get a
            # role through EKS Pod Identity instead of keys.
            - name: AWS_ACCESS_KEY_ID
              value: emulator
            - name: AWS_SECRET_ACCESS_KEY
              value: emulator
            {{- end }}
          readinessProbe:
            httpGet: { path: {{ .Values.healthPath }}, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: {{ .Values.healthPath }}, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            # The image can't be changed at runtime; scratch files go to the in-memory /tmp below.
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 32Mi }
