# Pods for 'kyverno test': one that follows every rule, and ones that each break one.
---
apiVersion: v1
kind: Pod
metadata: { name: compliant, namespace: payments }
spec:
  securityContext: { runAsNonRoot: true, runAsUser: 10001 }
  containers:
    - name: app
      image: ghcr.io/launchbay-labs/payments:1b2c3d4e5f60718293a4b5c6d7e8f90112233445
      securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } }
      readinessProbe: { httpGet: { path: /healthz, port: 8000 } }
      livenessProbe: { httpGet: { path: /healthz, port: 8000 } }
---
