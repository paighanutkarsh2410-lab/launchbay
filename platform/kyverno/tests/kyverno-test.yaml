# Run with: kyverno test platform/kyverno/tests
# Signature checks need a registry and Sigstore, so they are proven on the cluster instead
# (scripts/verify-guardrails.sh).
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: launchbay-guardrails
policies:
  - ../policies/restrict-registries.yaml
  - ../policies/pod-security.yaml
  - ../policies/operability.yaml
resources:
  - resources.yaml
variables: values.yaml
results:
  - policy: launchbay-restrict-registries
    kind: Pod
    resources: [compliant, pinned-digest, runs-as-root, privileged, keeps-capabilities, host-network, no-limits, no-probes]
    result: pass
  - policy: launchbay-restrict-registries
    kind: Pod
    resources: [foreign-registry, latest-tag, untagged]
    result: fail
  - policy: launchbay-pod-security
    kind: Pod
    resources: [compliant, foreign-registry, latest-tag, untagged, pinned-digest, no-limits, no-probes]
    result: pass
  - policy: launchbay-pod-security
    kind: Pod
    resources: [runs-as-root, privileged, keeps-capabilities, host-network]
    result: fail
  - policy: launchbay-require-operability
    kind: Pod
    resources: [compliant, foreign-registry, latest-tag, untagged, pinned-digest, runs-as-root, privileged, keeps-capabilities, host-network]
    result: pass
  - policy: launchbay-require-operability
    kind: Pod
    resources: [no-limits, no-probes]
    result: fail
