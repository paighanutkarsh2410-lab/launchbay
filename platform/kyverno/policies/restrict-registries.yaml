# Launched services only run images built by Launchbay pipelines, never by a mutable tag.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: launchbay-restrict-registries
  annotations:
    launchbay.dev/title: Trusted registry, pinned tags
    launchbay.dev/rules: |
      Images come only from ghcr.io/launchbay-labs
      Pinned to a commit tag or digest, never :latest
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments]
  matchConstraints:
    namespaceSelector:
      matchLabels:
        launchbay.dev/managed: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: containers
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: "variables.containers.all(c, c.image.startsWith('ghcr.io/launchbay-labs/'))"
      message: "Images must come from ghcr.io/launchbay-labs/, built by a Launchbay pipeline."
    - expression: >-
        variables.containers.all(c, c.image.contains('@sha256:') ||
          (c.image.split('/')[size(c.image.split('/')) - 1].contains(':') && !c.image.endsWith(':latest')))
      message: "Pin images to a commit tag or digest; :latest and untagged images are not allowed."
