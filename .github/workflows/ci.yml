name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest -q

  portal:
    name: Portal typecheck, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  templates:
    name: Templates render, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Render every template
        working-directory: services/api
        run: |
          pip install -q -e .
          python tests/render_templates.py "$RUNNER_TEMP/rendered"
      - name: Python template tests
        working-directory: ${{ runner.temp }}/rendered/python-fastapi
        run: pip install -q -r requirements-dev.txt && pytest -q
      - name: Node template tests
        working-directory: ${{ runner.temp }}/rendered/node-express
        run: npm install --no-audit --no-fund && npm test
      - name: Every template's image builds
        run: |
          for dir in "$RUNNER_TEMP"/rendered/*/; do
            echo "::group::docker build $(basename "$dir")"
            docker build -q -t "template-check:$(basename "$dir")" "$dir"
            echo "::endgroup::"
          done

  security:
    name: Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          skip-dirs: templates
          # Fail on anything fixable; findings with no upstream fix yet are tracked, not blocking.
          ignore-unfixed: true
          exit-code: "1"
