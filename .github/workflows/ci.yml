name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest -q

  portal:
    name: Portal typecheck, lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  demo-image:
    name: Public demo image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f services/api/Dockerfile -t launchbay-api .
      - name: It starts in demo mode, seeded and guarded
        run: |
          docker run -d --name demo -p 8000:8000 -e LAUNCHBAY_PUBLIC_DEMO=true launchbay-api
          for i in $(seq 1 30); do curl -fs localhost:8000/api/healthz >/dev/null && break; sleep 1; done
          curl -fs localhost:8000/api/info | grep -q '"public_demo":true'
          test "$(curl -fs localhost:8000/api/services | grep -o '"name"' | wc -l)" -ge 1
          seeded="$(curl -fs localhost:8000/api/services | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["name"])')"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/services/$seeded/retry)" = 403
      - if: failure()
        run: docker logs demo

  e2e:
    name: Portal smoke tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - name: Install the API (it runs in demo mode)
        working-directory: services/api
        run: pip install -e .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Launch a service through the portal, start to live
        run: npm run e2e
      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/portal/test-results
          retention-days: 7

  templates:
    name: Templates render, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Render every template
        working-directory: services/api
        run: |
          pip install -q -e .
          python tests/render_templates.py "$RUNNER_TEMP/rendered"
      - name: Python template tests
        working-directory: ${{ runner.temp }}/rendered/python-fastapi
        run: pip install -q -r requirements-dev.txt && pytest -q
      - name: Node template tests
        working-directory: ${{ runner.temp }}/rendered/node-express
        run: npm install --no-audit --no-fund && npm test
      - name: Every template's image builds
        run: |
          for dir in "$RUNNER_TEMP"/rendered/*/; do
            echo "::group::docker build $(basename "$dir")"
            docker build -q -t "template-check:$(basename "$dir")" "$dir"
            echo "::endgroup::"
          done
      # Run each image as the cluster will: its template's UID, then the health check "Go live" uses.
      - name: Every template's container starts and is healthy
        run: |
          for meta in templates/*/template.yaml; do
            id=$(basename "$(dirname "$meta")")
            port=$(sed -n 's/^port: //p' "$meta"); uid=$(sed -n 's/^uid: //p' "$meta")
            docker run -d --name "$id" --user "$uid:$uid" -p "18080:$port" "template-check:$id" >/dev/null
            ok=""
            for i in $(seq 1 30); do curl -fs localhost:18080/healthz >/dev/null && ok=1 && break; sleep 1; done
            [ -n "$ok" ] || { echo "::error::$id is not healthy as uid $uid on :$port"; docker logs "$id"; exit 1; }
            echo "$id healthy as uid $uid on :$port"
            docker rm -f "$id" >/dev/null
          done
      # The same gate a launched service's own pipeline applies, run here first.
      - name: Scan the Python template image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with: { image-ref: "template-check:python-fastapi", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }
      - name: Scan the Node template image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with: { image-ref: "template-check:node-express", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }
      - name: Scan the static-site template image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with: { image-ref: "template-check:static-site", severity: "CRITICAL,HIGH", ignore-unfixed: true, exit-code: "1" }

  guardrails:
    name: Guardrail policies
    runs-on: ubuntu-latest
    env:
      KYVERNO_VERSION: v1.19.2 # matches the cluster's Kyverno (platform-up.sh)
    steps:
      - uses: actions/checkout@v4
      - name: Install the Kyverno CLI (checksum-verified)
        run: |
          base="https://github.com/kyverno/kyverno/releases/download/$KYVERNO_VERSION"
          file="kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz"
          curl -fsSLO "$base/$file" && curl -fsSLO "$base/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum --check --strict
          tar -xzf "$file" kyverno && sudo mv kyverno /usr/local/bin/
      - name: Every policy admits and rejects what it should
        run: kyverno test platform/kyverno/tests
      - name: Platform scripts parse
        run: for s in scripts/*.sh launchbay; do bash -n "$s"; done

  terraform:
    name: Terraform modules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/terraform/service
    services:
      # The same AWS emulator the cluster runs, for the integration test.
      moto:
        image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
        ports: ["5000:5000"]
        env:
          S3_IGNORE_SUBDOMAIN_BUCKETNAME: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: terraform fmt -recursive -check ..
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: Unit tests (mocked AWS provider)
        run: terraform test -filter=tests/plan.tftest.hcl
      - name: Integration test (apply and destroy on Moto)
        env:
          AWS_ACCESS_KEY_ID: emulator
          AWS_SECRET_ACCESS_KEY: emulator
        # aws.localtest.me resolves to 127.0.0.1, including the <account>.aws.localtest.me
        # host the provider uses for S3 Control.
        run: |
          for i in $(seq 1 30); do curl -fs http://localhost:5000/moto-api/data.json >/dev/null && break; sleep 1; done
          terraform test -filter=tests/emulator.tftest.hcl -var endpoint=http://aws.localtest.me:5000

  security:
    name: Trivy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          # Templates are scanned as built images; the kyverno tests hold deliberately bad pods.
          skip-dirs: templates,platform/kyverno/tests
          # Fail on anything fixable; findings with no upstream fix yet are tracked, not blocking.
          ignore-unfixed: true
          exit-code: "1"
