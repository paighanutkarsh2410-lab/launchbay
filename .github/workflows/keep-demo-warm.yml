# Free Render services sleep after 15 idle minutes and take about a minute to wake. A light ping
# every ten minutes keeps the public demo responsive. One always-on instance stays within
# Render's 750 free hours a month. Set the repository variable DEMO_API_URL to turn it on.
name: Keep the demo warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.DEMO_API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the demo API
        env:
          URL: ${{ vars.DEMO_API_URL }}
        run: curl -fsS --retry 6 --retry-delay 15 --retry-all-errors --max-time 30 "$URL/api/healthz"
