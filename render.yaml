# Render Blueprint for the public demo API (render.com, free web service).
# The portal is a static site on Cloudflare Pages; see docs/public-demo.md.
services:
  - type: web
    name: launchbay-demo-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    autoDeploy: true
    # Only rebuild when something the API image contains changes.
    buildFilter:
      paths:
        - services/api/**
        - templates/**
        - platform/kyverno/policies/**
        - render.yaml
    envVars:
      - key: LAUNCHBAY_PUBLIC_DEMO
        value: "true"
      # The portal's address on Cloudflare Pages.
      - key: LAUNCHBAY_CORS_ORIGINS
        value: '["https://launchbay-593.pages.dev"]'
